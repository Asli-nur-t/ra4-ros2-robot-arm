# ros_gz_bridge konfigurasyonu: Gazebo <-> ROS 2 topic koprusu
# Eklem durumlari ve eklem komutlari ros2_control (gz_ros2_control) uzerinden aktigi icin
# burada yalnizca saat, sensorler ve link pozlari kopruleniyor.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/aslikol/imu"
  gz_topic_name: "/aslikol/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/aslikol/camera/image"
  gz_topic_name: "/aslikol/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/aslikol/camera/camera_info"
  gz_topic_name: "/aslikol/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Fizik motorundaki link pozlari (PosePublisher, model frame'ine gore)
- ros_topic_name: "/aslikol/gz_link_poses"
  gz_topic_name: "/aslikol/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
